[project]
name = "researchmind-backend"
version = "0.1.0"
description = "ResearchMind AI backend — FastAPI service for document ingestion, retrieval, agents, and the knowledge graph."
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic[email]>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "structlog>=24.4,<25.0",
    "sqlalchemy>=2.0,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.13,<2.0",
    "pyjwt>=2.9,<3.0",
    "bcrypt>=4.2,<5.0",
    "slowapi>=0.1.9,<0.2",
    "python-multipart>=0.0.12,<0.1",
    "celery[redis]>=5.4,<6.0",
    "pymupdf>=1.24,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "httpx>=0.27,<0.28",
    "ruff>=0.7,<0.8",
    "aiosqlite>=0.20,<0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom (`Depends(...)` as a default) is
# intentional, not the mutable-default-argument bug B008 targets.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Header",
    "fastapi.Query",
]
