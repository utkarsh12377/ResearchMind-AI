global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: researchmind

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: researchmind-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          component: api
