apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: researchmind
  namespace: researchmind
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

    # The research and chat endpoints stream server-sent events. Without these
    # three, NGINX buffers the whole response and the client sees nothing until
    # the run finishes -- which is the entire point of streaming it.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"

    # Matches max_upload_bytes. Leaving it at the 1MB default would reject
    # every real paper at the proxy, before the API ever sees it.
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"

    nginx.ingress.kubernetes.io/enable-cors: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - researchmind.example.com
      secretName: researchmind-tls
  rules:
    - host: researchmind.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
---
# /metrics is deliberately absent from the Ingress. Prometheus scrapes the pod
# directly inside the cluster; exposing it publicly would hand an attacker a
# free map of route names, error rates, and traffic volume.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-ingress
  namespace: researchmind
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: web
      ports:
        - protocol: TCP
          port: 8000
