# Template only. Copy to secret.yaml, fill in real values, and apply that file --
# secret.yaml is git-ignored. In a real cluster this is better handled by
# External Secrets or Sealed Secrets so values never exist in plaintext at all.
apiVersion: v1
kind: Secret
metadata:
  name: researchmind-secrets
  namespace: researchmind
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://researchmind:CHANGE_ME@postgres:5432/researchmind"
  # Rotating this invalidates every outstanding token. That blast radius is the
  # intended behaviour, not a side effect.
  JWT_SECRET: "CHANGE_ME_TO_A_RANDOM_64_CHARACTER_VALUE"
  POSTGRES_PASSWORD: "CHANGE_ME"
  NEO4J_PASSWORD: "CHANGE_ME"
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  GEMINI_API_KEY: ""
  TAVILY_API_KEY: ""
