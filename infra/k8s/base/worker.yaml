apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: researchmind
  labels:
    app.kubernetes.io/name: researchmind
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: researchmind
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      # Ingestion holds a whole PDF in memory while parsing and rasterising it,
      # so a worker draining mid-paper has to be allowed to finish rather than
      # being killed at the default 30 seconds.
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: ghcr.io/utkarsh12377/researchmind-backend:latest
          command:
            - celery
            - -A
            - app.worker.celery_app.celery_app
            - worker
            - --loglevel=info
            - --concurrency=2
          envFrom:
            - configMapRef:
                name: researchmind-config
            - secretRef:
                name: researchmind-secrets
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - app.worker.celery_app.celery_app
                - inspect
                - ping
                - -d
                - celery@$(HOSTNAME)
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 15
          resources:
            requests:
              cpu: 500m
              # Higher than the API: PDF rasterisation for OCR is the memory
              # peak in the whole system.
              memory: 1Gi
            limits:
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: paper-storage
              mountPath: /app/storage
      volumes:
        - name: paper-storage
          persistentVolumeClaim:
            claimName: paper-storage
---
# Shared between the API and the workers: the API writes the uploaded blob and
# a worker reads it back, so ReadWriteMany is a hard requirement rather than a
# convenience. On a cluster without an RWX StorageClass, swap this for object
# storage behind the StorageBackend interface.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paper-storage
  namespace: researchmind
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 50Gi
