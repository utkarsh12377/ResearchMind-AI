# Reverse proxy for the Docker Compose deployment. The Kubernetes path uses an
# Ingress instead (infra/k8s/base/ingress.yaml); the settings that matter are
# the same in both, because they are properties of this API rather than of the
# platform in front of it.

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # Request ids are generated here when a client did not supply one, so a log
    # line in NGINX and a log line in the application share a correlation key.
    map $http_x_request_id $request_id_final {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format json escape=json
        '{"time":"$time_iso8601","request_id":"$request_id_final",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"duration":$request_time,'
        '"upstream_time":"$upstream_response_time"}';

    access_log /var/log/nginx/access.log json;

    gzip on;
    gzip_types application/json text/css application/javascript text/plain;
    gzip_min_length 1024;

    # Bucketed by IP. These are the endpoints an unauthenticated attacker can
    # hit without limit, so the cheap control belongs at the edge rather than
    # only in the application.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;

    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 100m;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id_final;

        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://backend;
        }

        # Server-sent events. Buffering here would hold the whole agent run and
        # release it at the end, which defeats streaming entirely; the long
        # timeouts exist because a full multi-agent run legitimately takes
        # minutes.
        location ~ ^/api/v1/(research|chat)/stream$ {
            proxy_pass http://backend;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            chunked_transfer_encoding on;
        }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://backend;
            proxy_read_timeout 120s;
        }

        location = /health {
            access_log off;
            proxy_pass http://backend;
        }

        # Not proxied. Prometheus scrapes the container directly; publishing
        # route names, error rates, and traffic volume at the edge is free
        # reconnaissance.
        location = /metrics {
            return 404;
        }

        location / {
            proxy_pass http://frontend;
        }
    }
}
